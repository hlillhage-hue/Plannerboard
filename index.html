<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#2d4a3e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Post-it">
<link rel="manifest" href="manifest.json">
<title>Henrik's Post-it Board</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root { --yellow:#f9e84e; --white-note:#f5f0e0; --board:#2d4a3e; --col:rgba(255,255,255,0.13); }
body { font-family:'Patrick Hand',cursive; background:var(--board); min-height:100vh; overflow-x:hidden; overflow-y:auto; }
header { position:sticky; top:0; z-index:100; background:rgba(20,40,30,0.95); border-bottom:1px solid rgba(255,255,255,0.1); display:flex; align-items:center; gap:8px; padding:10px 14px; flex-wrap:wrap; }
header h1 { font-family:'Caveat',cursive; font-size:26px; font-weight:700; color:var(--yellow); margin-right:auto; }
.hbtn { background:transparent; color:rgba(255,255,255,0.75); border:1.5px solid rgba(255,255,255,0.3); border-radius:20px; padding:6px 14px; font-family:'Patrick Hand',cursive; font-size:14px; cursor:pointer; }
.hbtn:active { opacity:0.6; }
.hbtn.on { background:rgba(249,232,78,0.2); color:var(--yellow); border-color:var(--yellow); }
#add-btn { background:var(--yellow); color:#1a3028; border:none; border-radius:50%; width:42px; height:42px; font-size:26px; font-weight:bold; cursor:pointer; }
#board { display:flex; gap:12px; padding:14px 12px 60px; align-items:flex-start; overflow-x:auto; }
.column { flex:0 0 calc(33.33vw - 14px); min-width:220px; background:var(--col); border-radius:14px; padding:10px 8px 14px; display:flex; flex-direction:column; }
.col-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; padding:0 4px; }
.col-title { font-family:'Caveat',cursive; font-size:22px; color:#fff; font-weight:700; }
.col-count { background:rgba(255,255,255,0.15); color:rgba(255,255,255,0.7); font-size:12px; padding:2px 8px; border-radius:20px; }
.notes-list { display:flex; flex-direction:column; min-height:60px; }
.drop-ind { height:3px; background:var(--yellow); border-radius:3px; margin:2px 4px; display:none; box-shadow:0 0 8px rgba(249,232,78,0.6); }
.drop-ind.on { display:block; }
.nwrap { padding:4px 0; }
.note { background:var(--yellow); border-radius:3px 12px 12px 3px; border-left:5px solid rgba(0,0,0,0.12); min-height:70px; position:relative; box-shadow:2px 3px 8px rgba(0,0,0,0.2); word-break:break-word; }
.note.white { background:var(--white-note); }
.note.dragging { opacity:0.35; }
.grip { padding:8px 12px 6px 14px; display:flex; align-items:center; gap:8px; border-bottom:1px solid rgba(0,0,0,0.07); -webkit-user-select:none; user-select:none; touch-action:none; cursor:grab; }
.grip-dots { color:rgba(0,0,0,0.3); font-size:16px; letter-spacing:2px; }
.grip-lbl { font-family:'Patrick Hand',cursive; font-size:11px; color:rgba(0,0,0,0.3); text-transform:uppercase; letter-spacing:1px; }
.nbody { padding:10px 12px 12px 14px; }
.ntxt { font-family:'Caveat',cursive; font-size:18px; font-weight:600; color:#1a1a1a; line-height:1.3; white-space:pre-wrap; }
.ntxt.done { text-decoration:line-through; opacity:0.5; }
.badge { display:inline-block; margin-top:6px; font-size:11px; color:rgba(0,0,0,0.45); border:1.5px solid rgba(0,0,0,0.25); border-radius:20px; padding:1px 8px; font-family:'Patrick Hand',cursive; font-weight:bold; letter-spacing:1px; }
.nacts { position:absolute; top:4px; right:6px; display:flex; gap:3px; }
.nbtn { background:rgba(0,0,0,0.08); border:none; border-radius:50%; width:26px; height:26px; font-size:13px; cursor:pointer; display:flex; align-items:center; justify-content:center; color:rgba(0,0,0,0.55); }
#overlay { display:none; position:fixed; inset:0; z-index:200; background:rgba(0,0,0,0.6); align-items:center; justify-content:center; }
#overlay.open { display:flex; }
#modal { background:var(--yellow); border-radius:4px 18px 18px 4px; border-left:7px solid rgba(0,0,0,0.15); padding:22px; width:min(88vw,400px); animation:pop 0.18s ease; }
@keyframes pop { from{transform:scale(0.88);opacity:0} to{transform:scale(1);opacity:1} }
#modal h2 { font-family:'Caveat',cursive; font-size:22px; margin-bottom:12px; }
#modal textarea { width:100%; height:90px; background:rgba(255,255,255,0.45); border:2px solid rgba(0,0,0,0.15); border-radius:8px; padding:8px 10px; font-family:'Caveat',cursive; font-size:19px; resize:none; outline:none; color:#1a1a1a; }
.mrow { display:flex; gap:10px; margin-top:10px; flex-wrap:wrap; align-items:center; }
.mrow label { font-size:13px; color:rgba(0,0,0,0.6); display:flex; align-items:center; gap:5px; }
.mrow select { padding:5px 8px; border-radius:7px; border:2px solid rgba(0,0,0,0.15); background:rgba(255,255,255,0.5); font-family:'Patrick Hand',cursive; font-size:14px; }
.mbtns { display:flex; gap:10px; margin-top:14px; justify-content:flex-end; }
.btn-c { padding:9px 18px; border-radius:9px; border:2px solid rgba(0,0,0,0.2); background:transparent; font-family:'Patrick Hand',cursive; font-size:14px; cursor:pointer; }
.btn-s { padding:9px 22px; border-radius:9px; background:#1a3028; color:var(--yellow); border:none; font-family:'Caveat',cursive; font-size:18px; font-weight:700; cursor:pointer; }
#imp { display:none; }
</style>
</head>
<body>
<header>
  <h1>📌 Henrik's Board</h1>
  <button class="hbtn" id="fbtn" onclick="toggleFilter()">👁 Visa klara</button>
  <button class="hbtn" id="rstbtn" onclick="forceReset()" style="border-color:rgba(255,100,100,0.5);color:rgba(255,150,150,0.9)">↺ Nollställ</button><button class="hbtn" onclick="doExport()">💾 Exportera</button>
  <input type="file" id="imp" accept=".json" onchange="doImport(event)">
  <button class="hbtn" onclick="document.getElementById('imp').click()">📂 Importera</button>
  <button class="hbtn" onclick="newDay()">🌅 Ny dag</button>
  <button id="add-btn" onclick="openModal(null)">+</button>
</header>
<div id="board">
  <div class="column">
    <div class="col-header"><span class="col-title">☀️ I dag</span><span class="col-count" id="cnt-idag">0</span></div>
    <div class="notes-list" id="lst-idag"></div>
  </div>
  <div class="column">
    <div class="col-header"><span class="col-title">🌤 I morgon</span><span class="col-count" id="cnt-imorgon">0</span></div>
    <div class="notes-list" id="lst-imorgon"></div>
  </div>
  <div class="column">
    <div class="col-header"><span class="col-title">🌙 Senare</span><span class="col-count" id="cnt-senare">0</span></div>
    <div class="notes-list" id="lst-senare"></div>
  </div>
</div>
<div id="overlay">
  <div id="modal">
    <h2 id="mtitle">Ny lapp</h2>
    <textarea id="mtxt" placeholder="Skriv..."></textarea>
    <div class="mrow">
      <label>Kolumn:<select id="mcol"><option value="idag">I dag</option><option value="imorgon">I morgon</option><option value="senare">Senare</option></select></label>
      <label><input type="checkbox" id="mapp"> APP</label>
      <label><input type="checkbox" id="mdone"> Klar</label>
      <label><input type="checkbox" id="mwhite"> Vit</label>
    </div>
    <div class="mbtns">
      <button class="btn-c" onclick="closeModal()">Avbryt</button>
      <button class="btn-s" onclick="saveModal()">Spara</button>
    </div>
  </div>
</div>
<script>
var NOTES = [
  {id:1, col:"idag",    text:"Träning\n-cykla\n-orientering\n-styrka", app:false, done:false, white:false},
  {id:2, col:"idag",    text:"Sök Jobb",                               app:false, done:false, white:false},
  {id:3, col:"idag",    text:"Gör Alva Labs",                          app:false, done:true,  white:true},
  {id:4, col:"idag",    text:"Hundkollen",                             app:true,  done:false, white:false},
  {id:5, col:"idag",    text:"Hundpatrullen\n-publicera",              app:true,  done:false, white:false},
  {id:6, col:"idag",    text:"Jobbsökverktyg\n-förbättra",            app:true,  done:false, white:false},
  {id:7, col:"senare",  text:"Projektassist",                          app:true,  done:false, white:false},
  {id:8, col:"senare",  text:"Elerspänning",                           app:true,  done:true,  white:false},
  {id:9, col:"senare",  text:"Intervju",                               app:true,  done:false, white:false},
  {id:10,col:"senare",  text:"Cykelfix\nClaude web",                   app:true,  done:false, white:false},
  {id:11,col:"senare",  text:"Plannerboard",                           app:true,  done:false, white:false},
  {id:12,col:"senare",  text:"Erfarenhet\n(dela kunskap)",             app:false, done:false, white:false},
  {id:13,col:"senare",  text:"Video Portalen",                         app:false, done:false, white:false},
  {id:14,col:"senare",  text:"Inlägg\nMinska konsultdag med 80%",     app:false, done:false, white:false},
  {id:15,col:"senare",  text:"Kunskapträning",                         app:false, done:false, white:false},
  {id:16,col:"senare",  text:"Egen Verksamhet",                        app:false, done:false, white:false}
];

var notes = [];
var editId = null;
var dragId = null;
var showDone = false;

if ("serviceWorker" in navigator) { navigator.serviceWorker.register("./sw.js"); }

function save() {
  try { localStorage.setItem("pnotes", JSON.stringify(notes)); } catch(e){}
  try { history.replaceState(null,null,"#"+btoa(encodeURIComponent(JSON.stringify(notes)))); } catch(e){}
}
function load() {
  try { var s=localStorage.getItem("pnotes"); if(s){var p=JSON.parse(s);if(Array.isArray(p)&&p.length>0){notes=p;return true;}} } catch(e){}
  try { var h=location.hash.slice(1); if(h){var p=JSON.parse(decodeURIComponent(atob(h)));if(Array.isArray(p)&&p.length){notes=p;return true;}} } catch(e){}
  return false;
}

function forceReset(){
  localStorage.removeItem("pnotes");
  notes=JSON.parse(JSON.stringify(NOTES));
  render();
  document.getElementById("rstbtn").textContent="✓ Klar";
}
function toggleFilter() {
  showDone = !showDone;
  var b = document.getElementById("fbtn");
  b.textContent = showDone ? "🙈 Dölj klara" : "👁 Visa klara";
  b.classList.toggle("on", showDone);
  applyFilter();
}
function applyFilter() {
  document.querySelectorAll(".nwrap").forEach(function(w) {
    var nid = w.dataset.nid;
    var n = notes.find(function(x){return String(x.id)===nid;});
    w.style.display = (n && n.done && !showDone) ? "none" : "";
  });
}

function render() {
  save();
  ["idag","imorgon","senare"].forEach(function(col) {
    var lst = document.getElementById("lst-"+col);
    var cnt = document.getElementById("cnt-"+col);
    var cn = notes.filter(function(n){return n.col===col;});
    cnt.textContent = cn.length;
    lst.innerHTML = "";
    lst.appendChild(mkInd(col,0));
    cn.forEach(function(n,i){
      lst.appendChild(mkCard(n));
      lst.appendChild(mkInd(col,i+1));
    });
  });
  applyFilter();
}

function mkInd(col,idx) {
  var d = document.createElement("div");
  d.className = "drop-ind";
  d.dataset.col = col;
  d.dataset.idx = idx;
  return d;
}

function mkCard(n) {
  var wrap = document.createElement("div");
  wrap.className = "nwrap";
  wrap.dataset.nid = String(n.id);

  var card = document.createElement("div");
  card.className = "note" + (n.white?" white":"");
  card.dataset.id = String(n.id);

  var grip = document.createElement("div");
  grip.className = "grip";
  grip.innerHTML = '<span class="grip-dots">&#10783;&#10783;&#10783;</span><span class="grip-lbl">dra</span>';
  grip.oncontextmenu = function(e){e.preventDefault();return false;};

  var acts = document.createElement("div");
  acts.className = "nacts";

  var eb = document.createElement("button"); eb.className="nbtn"; eb.textContent="✏️";
  eb.onclick = function(e){e.stopPropagation();openModal(n.id);};
  var db = document.createElement("button"); db.className="nbtn"; db.textContent=n.done?"↩️":"✔️";
  db.onclick = function(e){e.stopPropagation();toggleDone(n.id);};
  var xb = document.createElement("button"); xb.className="nbtn"; xb.textContent="🗑";
  xb.onclick = function(e){e.stopPropagation();delNote(n.id);};
  acts.appendChild(eb); acts.appendChild(db); acts.appendChild(xb);

  var body = document.createElement("div"); body.className="nbody";
  var txt = document.createElement("div"); txt.className="ntxt"+(n.done?" done":""); txt.textContent=n.text;
  body.appendChild(txt);
  if(n.app){var b=document.createElement("div");b.className="badge";b.textContent="● APP";body.appendChild(b);}

  card.appendChild(grip); card.appendChild(acts); card.appendChild(body);

  grip.draggable = true;
  grip.addEventListener("dragstart",function(){dragId=n.id;setTimeout(function(){card.classList.add("dragging");},0);});
  grip.addEventListener("dragend",function(){card.classList.remove("dragging");clearInds();});
  addTouch(grip,n.id,card);

  wrap.appendChild(card);
  return wrap;
}


document.addEventListener('dragover',function(e){
  e.preventDefault();
  updateIndicator(e.clientX, e.clientY);
});
document.addEventListener('drop',function(e){
  e.preventDefault();
  var ind=document.querySelector('.drop-ind.on');
  if(ind&&dragId!=null) moveNote(dragId,ind.dataset.col,parseInt(ind.dataset.idx));
  clearInds(); dragId=null;
});

function updateIndicator(x, y) {
  clearInds();
  // Find which column
  var tgtList = null;
  document.querySelectorAll('.notes-list').forEach(function(l){
    var r=l.getBoundingClientRect();
    if(x>=r.left&&x<=r.right) tgtList=l;
  });
  if(!tgtList){
    // closest column
    var best=null,bd=999999;
    document.querySelectorAll('.notes-list').forEach(function(l){
      var r=l.getBoundingClientRect(),mid=(r.left+r.right)/2,d=Math.abs(x-mid);
      if(d<bd){bd=d;best=l;}
    });
    tgtList=best;
  }
  if(!tgtList) return;

  // Find insert position by comparing y to card midpoints
  var col=tgtList.id.replace('lst-','');
  var cards=tgtList.querySelectorAll('.nwrap');
  var insertIdx=0;
  cards.forEach(function(card,i){
    var r=card.getBoundingClientRect();
    var mid=r.top+r.height/2;
    if(y>mid) insertIdx=i+1;
  });

  // Highlight the correct indicator
  var inds=tgtList.querySelectorAll('.drop-ind');
  if(inds[insertIdx]) inds[insertIdx].classList.add('on');
}

function clearInds(){document.querySelectorAll('.drop-ind.on').forEach(function(e){e.classList.remove('on');});}

var tid=null,tmov=false,tx=0,ty=0,pendingCol=null,pendingIdx=0;
function addTouch(grip,id,card){
  grip.addEventListener('touchstart',function(e){
    tid=id;tmov=false;
    tx=e.touches[0].clientX;ty=e.touches[0].clientY;
    pendingCol=null;pendingIdx=0;
  },{passive:true});
  grip.addEventListener('touchmove',function(e){
    if(!tid) return;
    var t=e.touches[0];
    if(Math.abs(t.clientX-tx)>5||Math.abs(t.clientY-ty)>5){
      tmov=true; e.preventDefault(); dragId=tid;
      card.classList.add('dragging');
      updateIndicator(t.clientX,t.clientY);
      // Save drop target during move, not on end
      var ind=document.querySelector('.drop-ind.on');
      if(ind){ pendingCol=ind.dataset.col; pendingIdx=parseInt(ind.dataset.idx); }
    }
  },{passive:false});
  grip.addEventListener('touchend',function(e){
    card.classList.remove('dragging');
    if(tmov&&tid!=null&&pendingCol!==null){
      moveNote(tid,pendingCol,pendingIdx);
    }
    clearInds(); tid=null; tmov=false; dragId=null; pendingCol=null; pendingIdx=0;
  });
  grip.oncontextmenu=function(e){e.preventDefault();return false;};
}
</script>
</body>
</html>
